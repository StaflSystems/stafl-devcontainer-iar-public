services:
  stafl-devcontainer-iar:
    build:
      context: stafl-devcontainer-iar
      dockerfile: Dockerfile
      args:
        - BXARM=non-fs # change to fs for FuSa edition
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
      - LMS2:/usr/local/etc/IARSystems

volumes:
  LMS2:
    name: LMS2
